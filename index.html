<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<script src="/amatu.js"></script>
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>/* phones + small tablets: whole app at 88% (layout widens to fill the screen); max-scale stops iOS zooming into inputs */
if (Math.min(screen.width, screen.height) <= 820) document.querySelector('meta[name=viewport]').content = 'width=device-width, initial-scale=0.88, minimum-scale=0.88, maximum-scale=0.88, viewport-fit=cover';</script>
<title>Calc</title>
<meta name="description" content="Calc: kalkulator scientific online + hitung luas (m²) dan volume (m³) konstruksi — kolom, balok, plat, U-Ditch, box culvert, buis, tabung, galian — simpan, beri nama, dan sinkron real time di HP dan laptop.">
<meta name="theme-color" content="#e8590c">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23e8590c'/><rect x='24' y='18' width='52' height='20' rx='5' fill='white'/><g fill='white'><circle cx='32' cy='54' r='6'/><circle cx='50' cy='54' r='6'/><circle cx='68' cy='54' r='6'/><circle cx='32' cy='72' r='6'/><circle cx='50' cy='72' r='6'/><circle cx='68' cy='72' r='6'/></g></svg>">
<style>:root{--bg:#f5f4f1;--card:#fff;--soft:#efede8;--line:#e2dfd8;--text:#1b1a17;--muted:#6d6a63;--acc:#e8590c;--acc-ink:#fff;--key:#f3f2ee;--key2:#e7e5df;--op:#fde9dc;--op-ink:#c2410c;--ok:#1f9d55;--red:#d6383e;--shadow:0 1px 2px rgba(40,30,10,.05),0 4px 14px rgba(40,30,10,.05);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121110;--card:#1c1b19;--soft:#262421;--line:#33302c;--text:#f2efe9;--muted:#a39e95;--acc:#ff8a3d;--acc-ink:#1b0e04;--key:#25231f;--key2:#2e2b27;--op:#3a2416;--op-ink:#ffae74;--ok:#4ad08a;--red:#ff6b70;--shadow:none;color-scheme:dark}}
:root[data-theme=dark]{--bg:#121110;--card:#1c1b19;--soft:#262421;--line:#33302c;--text:#f2efe9;--muted:#a39e95;--acc:#ff8a3d;--acc-ink:#1b0e04;--key:#25231f;--key2:#2e2b27;--op:#3a2416;--op-ink:#ffae74;--ok:#4ad08a;--red:#ff6b70;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 11px;min-width:0;color:var(--text)}
input:focus,select:focus{outline:2px solid color-mix(in srgb,var(--acc) 45%,transparent);border-color:var(--acc)}
a{color:inherit}
h1,h2{letter-spacing:-.01em}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 13px;cursor:pointer;font-weight:600;text-align:center;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--red)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.xs{padding:2px 8px;font-size:12px;border-radius:8px}
.muted{color:var(--muted)}.small{font-size:13px}
.sp{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.empty{padding:14px 4px;margin:0}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{padding:6px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;text-decoration:none;flex:none}
.logo{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(135deg,#ff8a3d,#d9480f);color:#fff;font-size:18px;font-weight:800}
.sync{font-size:12px;color:var(--muted);white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 11px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.shell{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.shell>.top{flex:none;position:relative}
.main{flex:1;min-height:0;overflow:auto;padding:20px 24px 40px;-webkit-overflow-scrolling:touch}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.head h1{margin:0;font-size:24px}
.head-r{display:flex;gap:8px;flex:1;justify-content:flex-end;min-width:260px}
.head-r input{flex:1;max-width:420px}
/* calculator — semua ukuran mengikuti ukuran bodi (container query), jadi proporsinya sama di layar apa pun */
.main.v-calc{display:flex;gap:14px;padding:10px 14px;overflow:hidden}
.fx{flex:0 0 auto;width:min(calc(100% - 330px),calc(100vh - 64px));min-width:0;min-height:0;padding:clamp(8px,1.3vh,16px);border-radius:20px;background:linear-gradient(178deg,#e6e8ea 0%,#d3d6d9 42%,#c6c9cd 100%);border:clamp(3px,.45vh,6px) solid #2c3038;box-shadow:0 6px 22px rgba(10,15,25,.26),inset 0 1px 0 #fff;color:#2c3038;user-select:none;-webkit-user-select:none}
.fx-in{container-type:size;width:100%;height:100%}
.fx-col{height:100cqh;display:flex;flex-direction:column;gap:1.1cqh}
/* layar */
.lcd-fr{flex:none;padding:min(1.1cqh,1.7cqw) min(1.5cqh,2.2cqw);border-radius:min(1.4cqh,2cqw);background:linear-gradient(180deg,#a9acb1,#d3d5d8 16%,#c6c8cc);box-shadow:inset 0 2px 5px rgba(20,25,35,.35)}
.lcd{--dot:max(2.2px,min(.36cqh,.52cqw));--gfs:max(13px,min(3cqh,4.4cqw));position:relative;height:25cqh;display:flex;flex-direction:column;padding:.5cqh min(1.2cqh,1.8cqw) .6cqh;border-radius:4px;overflow:hidden;color:#27377f;background:linear-gradient(112deg,#bcd7cf 0%,#b3d0cb 34%,#c5dbcd 58%,#d2dfc6 100%);box-shadow:inset 0 2px 6px rgba(20,40,40,.45)}
.l-ind{flex:none;display:flex;justify-content:space-between;gap:2px;font:700 max(8px,min(1.5cqh,2.1cqw))/1.25 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;white-space:nowrap;overflow:hidden}
.l-ind span{opacity:.11}
.l-ind span.on{opacity:1}
.l-body{flex:1;min-height:0;display:flex;flex-direction:column;font-family:"SF Mono",SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace;font-weight:800}
.l-expr,.l-res,.l-menu,.l-grid{-webkit-mask-image:radial-gradient(circle at 50% 50%,#000 60%,transparent 74%);mask-image:radial-gradient(circle at 50% 50%,#000 60%,transparent 74%);-webkit-mask-size:var(--dot) var(--dot);mask-size:var(--dot) var(--dot)}
.l-menu,.l-grid{-webkit-mask-size:calc(var(--dot)*.62) calc(var(--dot)*.62);mask-size:calc(var(--dot)*.62) calc(var(--dot)*.62)}
.lcd.off .l-body,.lcd.off .l-ind,.lcd.off .l-foot{visibility:hidden}
.l-expr,.l-res{flex:1 1 50%;min-height:0;display:flex;align-items:center;white-space:nowrap;scrollbar-width:none;font-variant-numeric:tabular-nums}
.l-expr{position:relative;justify-content:flex-start;overflow:hidden;font-size:max(21px,min(5.6cqh,7.6cqw));line-height:1.1}
.l-res{justify-content:flex-end;overflow:hidden;font-size:max(25px,min(6.8cqh,9.2cqw));line-height:1.1}
.l-expr[hidden],.l-res[hidden],.l-menu[hidden],.l-grid[hidden]{display:none}
.l-res .pv{opacity:.34;font-size:.62em}
.l-err{font-weight:800}
.l-msg{display:block;font-size:.3em;font-weight:700;margin-left:.9em;white-space:normal;line-height:1.15;max-width:48%}
.l-res:has(.l-err){justify-content:center}
.lcd sup{font-size:.6em;vertical-align:.62em;line-height:0}
.h-list sub{font-size:.65em}
.lcd sub{font-size:.6em;vertical-align:-.3em;line-height:0}
.cur{display:inline-block;width:.11em;height:1.02em;margin-right:-.11em;vertical-align:-.14em;background:currentColor;animation:curb 1s steps(1) infinite}
@keyframes curb{50%{opacity:0}}
.mx{display:inline-block;width:.08em}
.ps{display:inline}
.pb{display:inline-block;transform:scale(1,2.05);font-weight:500;vertical-align:.02em;margin:0 .03em}
.fx .fr-n{border-bottom:.1em solid currentColor}
.nat{display:inline-flex;align-items:center;vertical-align:middle}
.nat .big{font-size:1.5em;line-height:1}
.lims{display:inline-flex;flex-direction:column;justify-content:space-between;font-size:.5em;line-height:1.15;min-height:2.6em}
.dx{margin-left:.12em;font-size:.82em}
.at{font-size:1.1em}
.rx{margin-right:-.05em}
.l-menu{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:.25em;font-size:var(--gfs);line-height:1.22;overflow:hidden}
.lm-t{font-weight:800}
.lm-big{text-align:center;font-size:1.4em}
.lm-g{display:grid;grid-template-columns:repeat(var(--mc,2),minmax(0,1fr));gap:.04em .8em}
.lm-i{border:0;background:none;padding:0;color:inherit;font:inherit;text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden}
.lm-i:hover{background:rgba(39,55,127,.13)}
.lm-i sub{font-size:.65em;vertical-align:-.25em;line-height:0}
.lm-l{display:flex;align-items:center;justify-content:space-between;gap:1em;white-space:nowrap;font-size:1.25em;line-height:1.3}
.lm-l sub{font-size:.65em;vertical-align:-.25em;line-height:0}
.lm-l .fr{font-size:.72em}
.l-grid{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;line-height:1.24}
.lg{width:100%;border-collapse:collapse;table-layout:fixed;flex:none}
.lg th,.lg td{padding:0 .4em;font-weight:800;white-space:nowrap;overflow:hidden;text-align:right;height:1.24em}
.lg th:first-child{width:4.6em;text-align:left}
.lg tbody th{opacity:.6}
.lg thead th{opacity:.72;border-bottom:.08em solid currentColor}
.lg td.on{background:#27377f;color:#d4e3d3}
.lg-in{flex:1;min-height:1.24em;display:flex;align-items:flex-end;justify-content:space-between;gap:1em;white-space:nowrap;overflow:hidden}
.lg-in small{font-size:.72em;opacity:.65}
.l-err2{font-weight:800}
.l-foot{position:absolute;left:min(1.2cqh,1.8cqw);bottom:.6cqh;display:flex;gap:.8em;font:700 max(9px,min(1.45cqh,2.1cqw)) -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;pointer-events:none}
.l-foot span:empty{display:none}
.hnav{opacity:.72}
/* tombol */
.keys{flex:1;min-height:0;display:flex;flex-direction:column;gap:1cqh}
.kf,.kn{min-height:0;display:grid;column-gap:min(1.1cqh,1.8cqw);row-gap:.35cqh}
.kf{flex:5 1 0;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr))}
.kn{flex:4.3 1 0;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr))}
.ck{min-width:0;min-height:0;display:flex;flex-direction:column;gap:.15cqh;padding:0;border:0;background:none;color:inherit;cursor:pointer;touch-action:manipulation;font:inherit}
.ck-l{flex:none;height:max(10px,min(1.85cqh,3cqw));display:flex;align-items:flex-end;justify-content:center;gap:.4em;font-size:max(8px,min(1.5cqh,2.3cqw));line-height:1;white-space:nowrap}
.ck-l b{font-weight:600}
.ck-l .ls{color:#80591a}
.ck-l .la{color:#a23232}
.ck-l .lm{color:#1f7486}
.ck-l .lb{color:#333840;font-weight:700}
.ck-l .c-g{color:#565a61}
.ck-l .c-p{color:#853a9b}
.ck-l .c-t{color:#1f7486}
.ck-l sup,.ck-l sub{font-size:.68em;line-height:0}
.ck-l .box{width:.55em;height:.7em;border:.09em solid currentColor;border-radius:.05em;vertical-align:-.04em}
.ck-l .kd{font-size:.68em;margin:0}
.ck-l .kd .fr-n{border-bottom-width:.1em}
.fx.sh .ls,.fx.al .la{font-weight:800;text-shadow:0 0 .5px currentColor}
.fx.sh .ck.tk[data-v=shift] .ck-c,.fx.al .ck.tk[data-v=alpha] .ck-c{background:linear-gradient(180deg,#d9963a,#b4751f)}
.ck-c{flex:1;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;border-radius:min(1cqh,1.6cqw);color:#fff;font-size:max(11px,min(2.5cqh,3.8cqw));font-weight:600;line-height:1;background:linear-gradient(180deg,#67757f,#4a565f 60%,#3f4a52);box-shadow:0 .28cqh 0 #24292f,inset 0 1px 0 rgba(255,255,255,.22);margin-bottom:.28cqh;transition:transform .05s}
.ck:hover .ck-c{filter:brightness(1.1)}
.ck:active .ck-c{transform:translateY(.22cqh);box-shadow:0 .06cqh 0 #24292f,inset 0 1px 2px rgba(0,0,0,.35)}
.ck-c sup,.ck-c sub{font-size:.62em;line-height:0}
.ck-c .box{width:.58em;height:.74em;border:.09em solid currentColor;border-radius:.06em;vertical-align:-.06em}
.ck-c .fr-n{border-bottom-color:#fff}
.k2{display:inline-flex;flex-direction:column;gap:.05em;font-size:.56em;margin:0 .1em}
.kbar{display:inline-block;width:.7em;height:.44em;background:currentColor;border-radius:.05em}
.ck.tk .ck-c{border-radius:50%;background:linear-gradient(180deg,#46618b,#2d4468);box-shadow:0 .28cqh 0 #1a2740,inset 0 1px 0 rgba(255,255,255,.25)}
.ck.nk .ck-c{font-size:max(15px,min(3.6cqh,5.4cqw));font-weight:500;background:linear-gradient(180deg,#3f444c,#292d33 60%,#1f2227);box-shadow:0 .34cqh 0 #0b0d10,inset 0 1px 0 rgba(255,255,255,.18)}
.ck.rd .ck-c{font-size:max(14px,min(3.1cqh,4.6cqw));font-weight:500;background:linear-gradient(180deg,#b65a53,#973e3b 60%,#823331);box-shadow:0 .34cqh 0 #4e1b1a,inset 0 1px 0 rgba(255,255,255,.25)}
.ck[data-v=exp] .ck-c,.ck[data-v=ans] .ck-c{font-size:max(13px,min(2.9cqh,4.3cqw))}
.ck[data-v=sd] .ck-c{font-size:max(10px,min(2.2cqh,3.3cqw))}
.ck-c .kfr{font-size:.56em;line-height:1;margin:0}
.ck-c .kfr .box{width:.95em;height:.72em;display:block}
.ck-c .kfr .fr-n,.ck-c .kfr .fr-d{padding:.09em .08em}
.ck-l .kfr{font-size:.72em;margin:0 0 0 .1em}
.ck-l .kfr .box{display:block;width:.8em;height:.5em}
.ck-l .kfr .fr-n,.ck-l .kfr .fr-d{padding:.03em 0}
/* BASE-N: tombol yang tidak berlaku diredupkan, label DEC/HEX/… jadi utama */
.fx.m-BASE .ck[data-v=calc],.fx.m-BASE .ck[data-v=int],.fx.m-BASE .ck[data-v=inv],.fx.m-BASE .ck[data-v=logab],.fx.m-BASE .ck[data-v=frac],.fx.m-BASE .ck[data-v=sqrt],.fx.m-BASE .ck[data-v=rcl],.fx.m-BASE .ck[data-v=eng],.fx.m-BASE .ck[data-v=sd],.fx.m-BASE .ck[data-v=mp],.fx.m-BASE .ck[data-v=dot],.fx.m-BASE .ck[data-v=exp],
.fx.b10 .ck[data-v=neg],.fx.b10 .ck[data-v=dms],.fx.b10 .ck[data-v=hyp],.fx.b10 .ck[data-v=sin],.fx.b10 .ck[data-v=cos],.fx.b10 .ck[data-v=tan],
.fx.b8 .ck[data-v=neg],.fx.b8 .ck[data-v=dms],.fx.b8 .ck[data-v=hyp],.fx.b8 .ck[data-v=sin],.fx.b8 .ck[data-v=cos],.fx.b8 .ck[data-v=tan],.fx.b8 .ck[data-v="8"],.fx.b8 .ck[data-v="9"],
.fx.b2 .ck[data-v=neg],.fx.b2 .ck[data-v=dms],.fx.b2 .ck[data-v=hyp],.fx.b2 .ck[data-v=sin],.fx.b2 .ck[data-v=cos],.fx.b2 .ck[data-v=tan],.fx.b2 .ck[data-v="2"],.fx.b2 .ck[data-v="3"],.fx.b2 .ck[data-v="4"],.fx.b2 .ck[data-v="5"],.fx.b2 .ck[data-v="6"],.fx.b2 .ck[data-v="7"],.fx.b2 .ck[data-v="8"],.fx.b2 .ck[data-v="9"]{opacity:.38}
.fx.m-BASE .lm{font-weight:800}
/* D-pad REPLAY */
.dpad{grid-column:3/5;grid-row:1/3;place-self:center;position:relative;aspect-ratio:1;height:96%;max-width:100%;border-radius:50%;overflow:hidden;background:linear-gradient(160deg,#3e5a86,#22385c);box-shadow:0 2px 0 #142238,0 0 0 .35cqh #aeb1b6}
.dp{position:absolute;inset:0;border:0;padding:0;background:none;color:#b4c4dc;cursor:pointer;font-size:max(8px,min(1.5cqh,2.3cqw));touch-action:manipulation}
.dp:hover{background:rgba(255,255,255,.09)}
.dp:active{background:rgba(255,255,255,.2)}
.dp span{position:absolute;line-height:1}
.dp.up{clip-path:polygon(0 0,100% 0,50% 50%)}.dp.up span{top:5%;left:50%;transform:translateX(-50%)}
.dp.dn{clip-path:polygon(0 100%,100% 100%,50% 50%)}.dp.dn span{bottom:5%;left:50%;transform:translateX(-50%)}
.dp.lf{clip-path:polygon(0 0,0 100%,50% 50%)}.dp.lf span{left:5%;top:50%;transform:translateY(-50%)}
.dp.rt2{clip-path:polygon(100% 0,100% 100%,50% 50%)}.dp.rt2 span{right:5%;top:50%;transform:translateY(-50%)}
.dp-c{position:absolute;inset:19%;border-radius:50%;display:grid;place-items:center;pointer-events:none;background:linear-gradient(160deg,#3a5580,#2a4369);box-shadow:0 0 0 1px #1b2c49,inset 0 1px 0 rgba(255,255,255,.2);color:#9fb2ce;font-size:max(6px,min(1.05cqh,1.6cqw));font-weight:700;letter-spacing:.03em}
.top-h{display:none}
/* notasi matematika (layar & riwayat) */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .12em;font-size:.82em;line-height:1.1}
.fr-n{padding:0 .15em .06em;border-bottom:.08em solid currentColor}
.fr-d{padding:.06em .15em 0}
.box{display:inline-block;width:.6em;height:.8em;border:.07em dashed var(--muted);border-radius:.08em;vertical-align:middle}
.h-list sup{font-size:.6em}
.rt-in{border-top:.07em solid currentColor;padding:0 .1em}
.h-e .fr{font-size:.9em}
/* history */
.hist{flex:1 1 0;min-width:0;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}
.h-x{display:none}
.h-back{display:none}
.h-head{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.h-head h2{margin:0;font-size:16px;white-space:nowrap}
.h-list{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));align-content:start;gap:8px}
.h-tag{font-size:10.5px;font-weight:700;letter-spacing:.02em;color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent);border-radius:5px;padding:1px 5px}
.h-row{padding:9px 11px;border-radius:12px;background:var(--soft);cursor:pointer;text-align:right;display:flex;flex-direction:column;min-width:0}
.h-row:hover{outline:1px solid var(--acc)}
.h-e{color:var(--muted);font-size:13.5px;word-break:break-all}
.h-r{font-weight:700;font-size:18px;word-break:break-all;font-variant-numeric:tabular-nums}
.h-meta{display:flex;align-items:center;flex-wrap:wrap;gap:5px;margin-top:auto;padding-top:3px}
.h-meta .small{white-space:nowrap}
/* dialogs */
dialog{border:0;padding:0;border-radius:18px;background:var(--card);color:var(--text);width:min(460px,calc(100vw - 24px));box-shadow:0 30px 80px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,8,5,.45)}
.dlg{padding:20px;display:flex;flex-direction:column;gap:14px}
.dlg h2{margin:0;word-break:break-word}
.dlg-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fld{display:flex;flex-direction:column;gap:8px}
.fld>span{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg.two-s{grid-template-columns:1fr 1fr}
.seg label{position:relative}
.seg input{position:absolute;opacity:0}
.seg span{display:block;text-align:center;border:1px solid var(--line);border-radius:10px;padding:7px;cursor:pointer;font-weight:600}
.seg input:checked+span{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dlg-f{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.check{display:flex;align-items:center;gap:8px;font-weight:600}
.check input{width:18px;height:18px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;font-weight:600;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100vw - 32px);text-align:center}
.toast[hidden]{display:none}
/* gate (same as Planner, orange) */
.gate{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:radial-gradient(1100px 700px at 10% 0%,#d9480f 0%,transparent 60%),radial-gradient(900px 600px at 100% 100%,#b8860b 0%,transparent 55%),linear-gradient(160deg,#2a160b,#120c08)}
.gate-card{width:min(380px,100%);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-radius:24px;padding:34px 26px 24px;text-align:center;color:#fff;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.gate .logo{width:68px;height:68px;border-radius:20px;font-size:34px;margin:0 auto 12px}
.gate h1{margin:0;font-size:27px}
.gate-sub{margin:4px 0 22px;color:rgba(255,255,255,.75)}
.gate-field{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:4px 14px;text-align:left;margin-bottom:10px}
.gate-field:focus-within{border-color:#ffc9a3;box-shadow:0 0 0 3px rgba(255,201,163,.3)}
.gate-field input{flex:1;background:none;border:0;outline:0!important;color:#fff;font-size:16px;padding:10px 0}
.gate-field input::placeholder{color:rgba(255,255,255,.6)}
.mask-wrap{position:relative;flex:1;display:block;min-width:0}
.mask-wrap input,#user-mask{font:500 17px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.04em;padding:10px 0}
.mask-wrap input{width:100%;-webkit-text-fill-color:transparent;color:transparent;caret-color:#fff}
.mask-wrap input::placeholder{-webkit-text-fill-color:rgba(255,255,255,.6);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;letter-spacing:0}
#user-mask{position:absolute;inset:0;pointer-events:none;color:#fff;white-space:pre;overflow:hidden}
.gate-btn{width:100%;margin-top:4px;padding:12px;font-size:16px;font-weight:700;border-radius:14px;background:linear-gradient(135deg,#ff8a3d,#d9480f);border:0;color:#fff;cursor:pointer}
.gate-btn:disabled{opacity:.7}
.gate-err{color:#ffc2c2;min-height:18px;margin-top:10px;font-size:14px}
.gate-note{color:rgba(255,255,255,.65);font-size:12.5px;margin:6px 0 0;line-height:1.5}
.gate .check{justify-content:center;color:rgba(255,255,255,.85);font-weight:500;font-size:14px;margin:4px 0 10px}

  .fx{flex:1 1 auto;width:auto}
  .top-h{display:inline-block}
  .hist{position:fixed;top:0;right:0;bottom:0;width:min(420px,90vw);z-index:60;border-radius:16px 0 0 16px;transform:translateX(105%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.3);padding-top:calc(14px + env(safe-area-inset-top));padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  .hist.open{transform:none}
  .h-x{display:inline-block}
  .h-back{display:block;position:fixed;inset:0;z-index:55;background:rgba(10,8,5,.45)}
  .h-list{grid-template-columns:minmax(0,1fr)}
}
/* phones + small tablets */
@media (max-width:820px){
  .top-in{padding:6px 12px;gap:10px}

  .main.v-calc{overflow:auto}
  .fx{height:560px;flex:none;width:100%}
}

        if (it.deleted && it.kind === 'hist') S.items.delete(key(it)); else S.items.set(key(it), it);
      }
      S.seq = Math.max(S.seq, Number(r.seq));
    }
    if (changed || rows.length) saveCache();
    S.sync.at = new Date(); S.sync.err = '';
  } catch (e) { S.sync.err = e?.message === 'offline' ? 'offline — tersimpan di perangkat ini' : (e?.message || String(e)); }
  finally { S.sync.busy = false; }
  if (changed) S.sync.redraw = true; // a second round after this one must still draw what this one brought in
  if (S.sync.again) { S.sync.again = false; return syncNow(); }

// realtime: supabase broadcast pings (no data inside), plus a 10 s check
let sb = null, chans = [];
async function liveStart() {
  try {
    if (!window.supabase) await new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
    sb ||= window.supabase.createClient(SB_URL, SB_KEY);
    liveStop();
    const all = sb.channel('calc-all');
    if (S.admin) all.on('broadcast', { event: 'chg' }, () => syncNow());
    chans.push(all.subscribe());
    if (!S.admin) chans.push(sb.channel('calc-u-' + S.user).on('broadcast', { event: 'chg' }, () => syncNow()).subscribe());
  } catch {}
}
function liveStop() { if (sb) chans.forEach(c => sb.removeChannel(c)); chans = []; }
function ping() { for (const c of chans) try { c.send({ type: 'broadcast', event: 'chg', payload: { t: Date.now() } }); } catch {} }
const syncText = () => S.sync.err ? '⚠ ' + S.sync.err : S.sync.busy || S.queue.size ? '⏳ Menyimpan…' : S.sync.at ? '☁ Tersinkron ' + hms(S.sync.at) : '☁ Menghubungkan…';
function showSync() { document.querySelectorAll('.sync').forEach(e => { e.textContent = syncText(); }); }

// ---------- login (same accounts & PIN as Planner / Notes) ----------
const sha = async t => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)))].map(x => x.toString(16).padStart(2, '0')).join('');
const pinHash = (name, pin) => sha('planner-pin:' + name + ':' + pin);
const PIN_MSG = { need: 'Masukkan PIN.', wrong: 'PIN salah.', locked: 'Terlalu banyak PIN salah. Coba lagi 15 menit lagi.', format: 'PIN harus 4–12 angka.', invalid: 'Nama pengguna tidak valid.' };
function needPin(code) { // server says this session's PIN is missing/wrong: back to the PIN screen
  const name = S.user; if (!name) return;
  liveStop(); LS.set('u.' + name + '.haspin', '1'); SS.del('pin.' + name);
  S.user = null; S.pin = ''; S.items = new Map(); S.queue = new Set(); S.seq = 0;
  S.gate = { name, msg: code === 'locked' ? PIN_MSG.locked : 'Akun ini memakai PIN. Masukkan PIN untuk melanjutkan.' };
  if (dlg().open) dlg().close(); render();
}
async function login(raw, pass, remember, pin) {
  const name = normUser(raw);
  if (!validUser(name)) throw new Error('Nama pengguna 3–32 karakter: huruf, angka, titik, garis bawah, atau tanda minus.');
  if (name === ADMIN) {
    if (!pass) throw new Error('Masukkan password Admin.');
    const r = await rpc('cl_admin', { p_pass: pass, p_after: 0 }).catch(e => { throw new Error('Tidak bisa menghubungi server (' + e.message + ').'); });
    if (!r?.ok) throw new Error(r?.locked ? 'Terlalu banyak percobaan salah. Coba lagi 15 menit lagi.' : 'Password Admin salah.');
    S.admin = true; S.user = null; S.pass = pass;
    loadCache(); S.items = new Map(); S.seq = 0; S.users = r.users || [];
    for (const x of r.rows || []) { const it = { id: x.id, owner: x.owner, kind: x.kind, data: x.data || {}, updated: Number(x.updated), deleted: !!x.deleted }; S.items.set(key(it), it); S.seq = Math.max(S.seq, Number(x.seq)); }
    saveCache(); LS.set('admin.users', JSON.stringify(S.users)); S.sync.at = new Date();
    SS.set('admin', pass); if (remember) LS.set('session', JSON.stringify({ admin: true })); else LS.del('session');
  } else {
    let r = null;
    try { r = await rpc('pl_login', { p_owner: name, p_pin: pin || null }); } catch (e) { // offline: unlock with the PIN checked on this device before
      const h = LS.get('u.' + name + '.pinhash');
      if (h) { if (!pin) { const er = new Error(PIN_MSG.need); er.needPin = true; throw er; } if (await pinHash(name, pin) !== h) throw new Error(PIN_MSG.wrong); }
      else if (LS.get('u.' + name + '.haspin')) throw new Error('Tidak bisa menghubungi server (' + e.message + ').');
    }
    if (r && !r.ok) { const er = new Error(PIN_MSG[r.pin] || 'Gagal masuk.'); er.needPin = r.pin === 'need'; throw er; }
    S.admin = false; S.user = name; S.pass = ''; S.pin = pin || ''; S.gate = null;
    if (r) { S.hasPin = !!r.pin; if (r.pin) { LS.set('u.' + name + '.haspin', '1'); LS.set('u.' + name + '.pinhash', await pinHash(name, pin)); } else { LS.del('u.' + name + '.haspin'); LS.del('u.' + name + '.pinhash'); } }
    else S.hasPin = !!pin;
    if (pin) SS.set('pin.' + name, pin);
    loadCache();
    if (remember) LS.set('session', JSON.stringify({ user: name })); else { LS.del('session'); SS.set('user', name); }
    setTimeout(syncNow, 0);
  }
  liveStart();
}

  liveStop(); LS.del('session'); SS.del('admin'); SS.del('user'); if (S.user) SS.del('pin.' + S.user); S.pin = ''; S.gate = null;

    login(name, pinMode ? '' : $('#pass-in').value, $('#remember').checked, pin).then(render, e => {
      if (e.needPin && !pinMode) { S.gate = { name: normUser(name), msg: '' }; render(); return; }
      btn.disabled = false; btn.textContent = 'Masuk'; $('#gate-err').textContent = e.message; const pi = $('#pin-in'); if (pi) { pi.value = ''; pi.focus(); } });
  }
});
dlg().addEventListener('click', ev => { if (ev.target === dlg()) dlg().close(); }); // click on backdrop

// ---------- auto update + boot ----------
async function checkUpdate() { // phones keep old copies; load the newer build
  if (dlg().open || S.queue.size) return;
  try {
    const r = await fetch(location.pathname + '?_=' + Date.now(), { cache: 'no-store' }); const m = /const BUILD = '([^']+)'/.exec(await r.text());
    if (m && m[1] !== BUILD && m[1] !== '__BUILD__' && SS.get('reloaded') !== m[1]) { SS.set('reloaded', m[1]); location.replace(location.pathname + '?v=' + m[1] + location.hash); }
  } catch {}
}
setInterval(() => { if (!document.hidden) syncNow(); }, 10000);
setInterval(checkUpdate, 10 * 60e3);
document.addEventListener('visibilitychange', () => { if (!document.hidden) syncNow(); });
window.addEventListener('online', () => syncNow());
window.addEventListener('focus', () => syncNow());

function boot() {
  applyTheme(); checkUpdate();
  let s = null; try { s = JSON.parse(LS.get('session') || 'null'); } catch {}
  const ssUser = SS.get('user'), ssAdmin = SS.get('admin');
  if (s?.admin || ssAdmin) {
    if (ssAdmin) { S.admin = true; S.pass = ssAdmin; loadCache(); render(); liveStart(); syncNow(); return; }
    LS.del('session'); // admin password is never stored on the device; ask again
  } else if (s?.user || ssUser) {
    const name = s?.user || ssUser, pin = SS.get('pin.' + name) || '';
    if (LS.get('u.' + name + '.haspin') && !pin) { S.gate = { name, msg: '' }; render(); return; } // PIN asked on every new visit
    S.user = name; S.pin = pin; S.hasPin = !!LS.get('u.' + name + '.haspin'); loadCache();
    render(); liveStart(); syncNow(); return;
  }
  render();
}
boot();
</script>
