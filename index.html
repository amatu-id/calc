<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<script src="/amatu.js"></script>
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>/* phones + small tablets: whole app at 88% (layout widens to fill the screen); max-scale stops iOS zooming into inputs */
if (Math.min(screen.width, screen.height) <= 820) document.querySelector('meta[name=viewport]').content = 'width=device-width, initial-scale=0.88, minimum-scale=0.88, maximum-scale=0.88, viewport-fit=cover';</script>
<title>Calc</title>
<meta name="description" content="Calc: kalkulator scientific online + hitung luas (m²) dan volume (m³) konstruksi — kolom, balok, plat, U-Ditch, box culvert, buis, tabung, galian — simpan, beri nama, dan sinkron real time di HP dan laptop.">
<meta name="theme-color" content="#e8590c">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23e8590c'/><rect x='24' y='18' width='52' height='20' rx='5' fill='white'/><g fill='white'><circle cx='32' cy='54' r='6'/><circle cx='50' cy='54' r='6'/><circle cx='68' cy='54' r='6'/><circle cx='32' cy='72' r='6'/><circle cx='50' cy='72' r='6'/><circle cx='68' cy='72' r='6'/></g></svg>">
<style>:root{--bg:#f5f4f1;--card:#fff;--soft:#efede8;--line:#e2dfd8;--text:#1b1a17;--muted:#6d6a63;--acc:#e8590c;--acc-ink:#fff;--key:#f3f2ee;--key2:#e7e5df;--op:#fde9dc;--op-ink:#c2410c;--ok:#1f9d55;--red:#d6383e;--shadow:0 1px 2px rgba(40,30,10,.05),0 4px 14px rgba(40,30,10,.05);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121110;--card:#1c1b19;--soft:#262421;--line:#33302c;--text:#f2efe9;--muted:#a39e95;--acc:#ff8a3d;--acc-ink:#1b0e04;--key:#25231f;--key2:#2e2b27;--op:#3a2416;--op-ink:#ffae74;--ok:#4ad08a;--red:#ff6b70;--shadow:none;color-scheme:dark}}
:root[data-theme=dark]{--bg:#121110;--card:#1c1b19;--soft:#262421;--line:#33302c;--text:#f2efe9;--muted:#a39e95;--acc:#ff8a3d;--acc-ink:#1b0e04;--key:#25231f;--key2:#2e2b27;--op:#3a2416;--op-ink:#ffae74;--ok:#4ad08a;--red:#ff6b70;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 11px;min-width:0;color:var(--text)}
input:focus,select:focus{outline:2px solid color-mix(in srgb,var(--acc) 45%,transparent);border-color:var(--acc)}
a{color:inherit}
h1,h2{letter-spacing:-.01em}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 13px;cursor:pointer;font-weight:600;text-align:center;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--red)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.xs{padding:2px 8px;font-size:12px;border-radius:8px}
.muted{color:var(--muted)}.small{font-size:13px}
.sp{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.empty{padding:14px 4px;margin:0}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{padding:10px 24px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;text-decoration:none;flex:none}
.logo{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#ff8a3d,#d9480f);color:#fff;font-size:18px;font-weight:800}
.tabs{display:flex;gap:4px;flex:1;justify-content:center}
.tab{border:0;background:none;border-radius:10px;padding:7px 14px;cursor:pointer;font-weight:600;color:var(--muted)}
.tab:hover{background:var(--soft)}
.tab.on{background:color-mix(in srgb,var(--acc) 15%,transparent);color:var(--acc)}
.top-r{display:flex;align-items:center;gap:10px;flex:none}
.sync{font-size:12px;color:var(--muted);white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 11px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.shell{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.shell>.top{flex:none;position:relative}
.bnav{display:none}
.main{flex:1;min-height:0;overflow:auto;padding:20px 24px 40px;-webkit-overflow-scrolling:touch}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.head h1{margin:0;font-size:24px}
.head-r{display:flex;gap:8px;flex:1;justify-content:flex-end;min-width:260px}
.head-r input{flex:1;max-width:420px}
/* calculator — tata letak & layar mengikuti fx-115ES */
.main.v-calc{display:flex;gap:16px;padding:12px 18px;overflow:hidden}
.fx{--dot:clamp(2.4px,.36vh,4.4px);flex:0 1 calc((100vh - 56px)*1.16);min-width:0;min-height:0;display:flex;flex-direction:column;gap:clamp(6px,1vh,12px);padding:clamp(8px,1.3vh,18px) clamp(10px,1.5vw,26px) clamp(10px,1.5vh,22px);border-radius:26px;background:linear-gradient(178deg,#e4e6e8 0%,#cfd2d6 40%,#c3c6cb 100%);border:clamp(4px,.7vh,9px) solid #2c3038;box-shadow:0 10px 30px rgba(10,15,25,.3),inset 0 1px 0 #fff;color:#2c3038;user-select:none;-webkit-user-select:none}
.fx-top{flex:none;display:flex;align-items:center;gap:14px;min-height:28px}
.fx-brand{font-weight:800;font-size:clamp(15px,2.2vh,26px);color:#4d525a;letter-spacing:.02em;display:flex;flex-direction:column;line-height:1.05}
.fx-brand small{font-size:.48em;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#2f7f8f}
.fx-sol{display:none;margin-left:auto;height:clamp(28px,5.4vh,66px);width:clamp(180px,33%,420px);background:#3a2a22;border:2px solid #23262c;border-radius:4px;padding:2px;gap:2px;grid-template-columns:repeat(4,1fr)}
.fx-sol i{background:linear-gradient(135deg,#8c5a3c,#6d4029)}
.fx-h{display:none;margin-left:auto;background:#fff;color:#2c3038;border-color:#9b9fa6}
/* layar */
.lcd-fr{flex:none;padding:clamp(7px,1.3vh,16px) clamp(9px,1.4vw,20px);border-radius:14px;background:linear-gradient(180deg,#a9acb1,#d3d5d8 16%,#c6c8cc);box-shadow:inset 0 2px 5px rgba(20,25,35,.35)}
.lcd{position:relative;height:clamp(118px,25vh,320px);display:flex;flex-direction:column;padding:clamp(3px,.6vh,8px) clamp(8px,1vw,16px) clamp(4px,.7vh,10px);border-radius:5px;overflow:hidden;color:#27377f;background:linear-gradient(112deg,#bcd7cf 0%,#b3d0cb 34%,#c5dbcd 58%,#d2dfc6 100%);box-shadow:inset 0 2px 6px rgba(20,40,40,.45)}
.l-ind{flex:none;display:flex;justify-content:space-between;gap:2px;font:700 clamp(8px,min(1.4vh,1.5vw),15px)/1.25 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;white-space:nowrap;overflow:hidden}
.l-ind span{opacity:.11}
.l-ind span.on{opacity:1}
.l-body{flex:1;min-height:0;display:flex;flex-direction:column;font-family:"SF Mono",SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace;font-weight:800;-webkit-mask-image:radial-gradient(circle at 50% 50%,#000 60%,transparent 74%);mask-image:radial-gradient(circle at 50% 50%,#000 60%,transparent 74%);-webkit-mask-size:var(--dot) var(--dot);mask-size:var(--dot) var(--dot)}
.lcd.off .l-body,.lcd.off .l-ind,.lcd.off .hnav{visibility:hidden}
.l-expr,.l-res{flex:1 1 50%;min-height:0;display:flex;align-items:center;white-space:nowrap;scrollbar-width:none;font-variant-numeric:tabular-nums}
.l-expr{position:relative;justify-content:flex-start;overflow:hidden;font-size:clamp(25px,min(5.6vh,4.6vw),64px);line-height:1.1}
.l-res{justify-content:flex-end;overflow:hidden;font-size:clamp(29px,min(6.6vh,5.4vw),76px);line-height:1.1}
.l-expr[hidden],.l-res[hidden],.l-menu[hidden]{display:none}
.l-res .pv{opacity:.34;font-size:.62em}
.l-err{font-weight:800}
.l-msg{display:block;font-size:.3em;font-weight:700;margin-left:.9em;white-space:normal;line-height:1.15;max-width:48%}
.l-res:has(.l-err){justify-content:center}
.lcd sup{font-size:.6em;vertical-align:.62em;line-height:0}
.lcd sub{font-size:.6em;vertical-align:-.3em;line-height:0}
.cur{display:inline-block;width:.11em;height:1.02em;margin-right:-.11em;vertical-align:-.14em;background:currentColor;animation:curb 1s steps(1) infinite}
@keyframes curb{50%{opacity:0}}
.mx{display:inline-block;width:.08em}
.ps{display:inline}
.pb{display:inline-block;transform:scale(1,2.05);font-weight:500;vertical-align:.02em;margin:0 .03em}
.fx .fr-n{border-bottom:.1em solid currentColor}
.nat{display:inline-flex;align-items:center;vertical-align:middle}
.nat .big{font-size:1.5em;line-height:1}
.lims{display:inline-flex;flex-direction:column;justify-content:space-between;font-size:.5em;line-height:1.15;min-height:2.6em}
.dx{margin-left:.12em;font-size:.82em}
.at{font-size:1.1em}
.rx{margin-right:-.05em}
.l-menu{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:.3em;font-size:clamp(14px,min(3vh,2.5vw),36px);line-height:1.2}
.lm-t{font-weight:800}
.lm-g{display:grid;grid-template-columns:repeat(var(--mc,2),minmax(0,1fr));gap:.05em .8em}
.lm-i{border:0;background:none;padding:0;color:inherit;font:inherit;text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden}
.lm-i.dim{opacity:.42}
.lm-i sub{font-size:.65em;vertical-align:-.25em;line-height:0}
.hnav{position:absolute;left:clamp(8px,1vw,16px);bottom:clamp(3px,.6vh,8px);font:700 clamp(9px,1.3vh,13px) -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;opacity:.75}
.disp{position:absolute;left:0;bottom:0;width:1px;height:1px;padding:0;border:0!important;outline:0!important;opacity:0;pointer-events:none;background:none}
/* tombol */
.keys{flex:1;min-height:0;display:flex;flex-direction:column;gap:clamp(5px,.9vh,12px)}
.kf,.kn{min-height:0;display:grid;column-gap:clamp(5px,1vw,20px);row-gap:clamp(1px,.35vh,6px)}
.kf{flex:5 1 0;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr))}
.kn{flex:4.45 1 0;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr))}
.ck{min-width:0;min-height:0;display:flex;flex-direction:column;gap:clamp(0px,.15vh,3px);padding:0;border:0;background:none;color:inherit;cursor:pointer;touch-action:manipulation;font:inherit}
.ck-l{flex:none;height:clamp(11px,min(1.75vh,2.5vw),21px);display:flex;align-items:flex-end;justify-content:center;gap:.4em;font-size:clamp(8.5px,min(1.42vh,2vw),17px);line-height:1;white-space:nowrap;overflow:visible}
.ck-l b{font-weight:600}
.ck-l .ls{color:#8a6420}
.ck-l .la{color:#a23838}
.ck-l .lm{color:#2f7f8f}
.ck-l .lb{color:#3a3f47;font-weight:700}
.ck-l .c-g{color:#5d6168}
.ck-l .c-p{color:#8a3fa0}
.ck-l .c-t{color:#2f7f8f}
.ck-l sup,.ck-l sub{font-size:.68em;line-height:0}
.ck-l .box{width:.55em;height:.7em;border:.09em solid currentColor;border-radius:.05em;vertical-align:-.04em}
.ck-l .kd{font-size:.68em;margin:0}
.ck-l .kd .fr-n{border-bottom-width:.1em}
.fx.sh .ls,.fx.al .la{font-weight:800;text-shadow:0 0 .5px currentColor}
.ck-c{flex:1;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;border-radius:clamp(7px,1.15vh,16px);color:#fff;font-size:clamp(12px,min(2.5vh,2.9vw),29px);font-weight:600;line-height:1;background:linear-gradient(180deg,#67757f,#4a565f 60%,#3f4a52);box-shadow:0 clamp(1px,.3vh,4px) 0 #24292f,inset 0 1px 0 rgba(255,255,255,.22);transition:transform .05s}
.ck:hover .ck-c{filter:brightness(1.1)}
.ck:active .ck-c{transform:translateY(clamp(1px,.25vh,3px));box-shadow:0 0 0 #24292f,inset 0 1px 2px rgba(0,0,0,.35)}
.ck-c sup,.ck-c sub{font-size:.62em;line-height:0}
.ck-c .box{width:.58em;height:.74em;border:.09em solid currentColor;border-radius:.06em;vertical-align:-.06em}
.ck-c .fr-n{border-bottom-color:#fff}
.k2{display:inline-flex;flex-direction:column;gap:.05em;font-size:.56em;margin:0 .1em}
.kbar{display:inline-block;width:.7em;height:.44em;background:currentColor;border-radius:.05em}
.ck.tk .ck-c{border-radius:50%;background:linear-gradient(180deg,#46618b,#2d4468);box-shadow:0 clamp(1px,.3vh,4px) 0 #1a2740,inset 0 1px 0 rgba(255,255,255,.25)}
.ck.nk .ck-c{font-size:clamp(17px,min(3.7vh,4.3vw),44px);font-weight:500;background:linear-gradient(180deg,#3f444c,#292d33 60%,#1f2227);box-shadow:0 clamp(2px,.4vh,5px) 0 #0b0d10,inset 0 1px 0 rgba(255,255,255,.18)}
.ck.rd .ck-c{font-size:clamp(15px,min(3.1vh,3.7vw),38px);font-weight:500;background:linear-gradient(180deg,#b65a53,#973e3b 60%,#823331);box-shadow:0 clamp(2px,.4vh,5px) 0 #4e1b1a,inset 0 1px 0 rgba(255,255,255,.25)}
.ck[data-v=exp] .ck-c,.ck[data-v=ans] .ck-c{font-size:clamp(14px,min(2.9vh,3.5vw),36px)}
.ck[data-v=sd] .ck-c{font-size:clamp(11px,min(2.2vh,2.6vw),26px)}
.ck-c .kfr{font-size:.56em;line-height:1;margin:0}
.ck-c .kfr .box{width:.95em;height:.72em;display:block}
.ck-c .kfr .fr-n,.ck-c .kfr .fr-d{padding:.09em .08em}
.ck-l .kfr{font-size:.72em;margin:0 0 0 .1em}
.ck-l .kfr .box{display:block;width:.8em;height:.5em}
.ck-l .kfr .fr-n,.ck-l .kfr .fr-d{padding:.03em 0}
/* D-pad REPLAY */
.dpad{grid-column:3/5;grid-row:1/3;place-self:center;position:relative;aspect-ratio:1;height:100%;max-width:100%;border-radius:50%;overflow:hidden;background:linear-gradient(160deg,#3e5a86,#22385c);box-shadow:0 2px 0 #142238,0 0 0 clamp(2px,.4vh,5px) #aeb1b6}
.dp{position:absolute;inset:0;border:0;padding:0;background:none;color:#a9bbd6;cursor:pointer;font-size:clamp(8px,1.5vh,18px);touch-action:manipulation}
.dp:hover{background:rgba(255,255,255,.09)}
.dp:active{background:rgba(255,255,255,.2)}
.dp span{position:absolute;line-height:1}
.dp.up{clip-path:polygon(0 0,100% 0,50% 50%)}.dp.up span{top:5%;left:50%;transform:translateX(-50%)}
.dp.dn{clip-path:polygon(0 100%,100% 100%,50% 50%)}.dp.dn span{bottom:5%;left:50%;transform:translateX(-50%)}
.dp.lf{clip-path:polygon(0 0,0 100%,50% 50%)}.dp.lf span{left:5%;top:50%;transform:translateY(-50%)}
.dp.rt2{clip-path:polygon(100% 0,100% 100%,50% 50%)}.dp.rt2 span{right:5%;top:50%;transform:translateY(-50%)}
.dp-c{position:absolute;inset:19%;border-radius:50%;display:grid;place-items:center;pointer-events:none;background:linear-gradient(160deg,#3a5580,#2a4369);box-shadow:0 0 0 1px #1b2c49,inset 0 1px 0 rgba(255,255,255,.2);color:#8ea2c0;font-size:clamp(6px,1.15vh,15px);font-weight:700;letter-spacing:.03em}
@media (min-height:880px){.fx-sol{display:grid}}
@media (max-width:1100px) and (min-width:761px){.fx{flex:1 1 62%}.hist{flex:1 1 38%;min-width:260px;padding:10px}}
@media (max-width:760px){.lcd{height:clamp(96px,19vh,240px)}.fx-sol{height:clamp(24px,3.6vh,40px);margin-left:auto}.fx-sol+.fx-h{margin-left:0}}
@media (max-height:800px) and (min-width:761px){.fx-top{display:none}.main.v-calc{padding:8px 14px}}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .12em;font-size:.82em;line-height:1.1}
.fr-n{padding:0 .15em .06em;border-bottom:.08em solid currentColor}
.fr-d{padding:.06em .15em 0}
.box{display:inline-block;width:.6em;height:.8em;border:.07em dashed var(--muted);border-radius:.08em;vertical-align:middle}
.h-list sup{font-size:.6em}
.rt-in{border-top:.07em solid currentColor;padding:0 .1em}
.h-e .fr{font-size:.9em}
/* history */
.hist{flex:1 1 300px;min-width:280px;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}
.h-x{display:none}
.h-back{display:none}
.h-head{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.h-head h2{margin:0;font-size:16px;white-space:nowrap}
.h-list{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:6px}
.h-row{padding:9px 11px;border-radius:12px;background:var(--soft);cursor:pointer;text-align:right}
.h-row:hover{outline:1px solid var(--acc)}
.h-e{color:var(--muted);font-size:13.5px;word-break:break-all}
.h-r{font-weight:700;font-size:18px;word-break:break-all;font-variant-numeric:tabular-nums}
.h-meta{display:flex;align-items:center;flex-wrap:wrap;gap:5px;margin-top:2px}
.h-meta .small{white-space:nowrap}
/* luas & volume */
.main.v-geo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.geo-l{display:flex;flex-direction:column;gap:12px;min-width:0}
.seg2{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--soft);padding:5px;border-radius:14px}
.seg2 button{border:0;background:none;padding:9px;border-radius:10px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg2 button.on{background:var(--card);box-shadow:var(--shadow);color:var(--acc)}
.seg2.sm{padding:3px;border-radius:11px}.seg2.sm button{padding:6px;font-size:13.5px}
.shape-pick{display:flex;gap:8px}
.shape-pick select{flex:1;font-size:16px;padding:10px 12px;font-weight:600}
.shape-pick .btn.on{border-color:var(--acc);color:var(--acc)}
.cgs[hidden]{display:none}
.cgs{display:flex;flex-direction:column;gap:8px}
.cg-t{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:4px}
.shp{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 9px;cursor:pointer;font-weight:600;font-size:13px;text-align:left;line-height:1.2}
.shp span{font-size:16px;width:20px;text-align:center;flex:none}
.shp:hover{border-color:var(--acc)}
.shp.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--card));color:var(--acc)}
.fcard{padding:16px;display:flex;flex-direction:column;gap:12px}
.f-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.f-head h2{margin:0;font-size:19px}
.rumus{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:var(--acc);margin-top:4px}
.dg{width:190px;height:auto;flex:none;color:var(--text)}
.dg .f1{fill:color-mix(in srgb,var(--acc) 18%,transparent);stroke:var(--acc);stroke-width:1.6;stroke-linejoin:round}
.dg .f2{fill:color-mix(in srgb,var(--acc) 30%,transparent);stroke:var(--acc);stroke-width:1.6;stroke-linejoin:round}
.dg .f3{fill:color-mix(in srgb,var(--acc) 8%,transparent);stroke:var(--acc);stroke-width:1.6;stroke-linejoin:round}
.dg .hole{fill:var(--card);stroke:var(--acc);stroke-width:1.6}
.dg .ln{fill:none;stroke:var(--acc);stroke-width:1;stroke-dasharray:3 3}

}

}
function lineRow(ln, i, ro) {

function recap(d) {
  const g = new Map();
  for (const ln of d.lines || []) { const c = lineCat(ln); if (!c) continue; const k = ln.sh === 'expr' ? 'expr-' + c : ln.sh; const x = g.get(k) || { n: ln.sh === 'expr' ? 'Kalkulator' : SMAP.get(ln.sh)?.n, c, v: 0, cnt: 0 }; x.v += ln.tot || 0; x.cnt++; g.set(k, x); }
  if (g.size < 2) return '';
  return `<details class="recap"><summary>Rekap per jenis (${g.size})</summary><table>${[...g.values()].sort((a, b) => a.c.localeCompare(b.c) || b.v - a.v).map(x => `<tr><td>${esc(x.n)} <span class="muted small">${x.cnt} item</span></td><td class="num">${R(x.v)} ${UNIT_TXT[x.c]}</td></tr>`).join('')}</table></details>`;
}

function docCsv(d) {

function openMenu() {
  const theme = LS.get('theme') || 'auto', dec = LS.get('dec') === 'en' ? 'en' : 'id';
  dlg().innerHTML = `<div class="dlg"><h2>${S.admin ? '🛡 Admin' : '👤 ' + esc(S.user)}</h2>
    <p class="muted small" style="margin:0">${syncText()} · versi ${BUILD}</p>
    <div class="fld"><span>Tampilan</span><div class="seg">${[['auto', 'Otomatis'], ['light', 'Terang'], ['dark', 'Gelap']].map(([v, l]) => `<label><input type="radio" name="theme" value="${v}"${theme === v ? ' checked' : ''}><span>${l}</span></label>`).join('')}</div></div>
    <div class="fld"><span>Format angka hasil</span><div class="seg two-s">${[['id', '1.234,567'], ['en', '1,234.567']].map(([v, l]) => `<label><input type="radio" name="dec" value="${v}"${dec === v ? ' checked' : ''}><span>${l}</span></label>`).join('')}</div></div>
    ${S.admin ? '<p class="muted small" style="margin:0">Mode Admin hanya melihat data semua pengguna (hanya baca), diperbarui real time.</p>' : `
    <div class="fld"><span>🔒 PIN masuk</span><p class="small" style="margin:0">${S.hasPin ? '✓ PIN aktif — diminta setiap kali masuk.' : 'Belum ada PIN. Pasang PIN agar data tidak bisa dibuka hanya dengan nama pengguna.'} PIN ini sama dengan PIN Planner & Notes.</p>
      ${S.hasPin ? '<input type="password" id="pin-old" inputmode="numeric" maxlength="12" placeholder="PIN saat ini" autocomplete="off">' : ''}
      <div class="two"><input type="password" id="pin-new" inputmode="numeric" maxlength="12" placeholder="PIN baru (4–12 angka)" autocomplete="new-password"><input type="password" id="pin-new2" inputmode="numeric" maxlength="12" placeholder="Ulangi PIN baru" autocomplete="new-password"></div>
      <div class="dlg-f" style="justify-content:flex-start"><button type="button" class="btn primary" data-a="pinsave">${S.hasPin ? 'Ubah PIN' : 'Pasang PIN'}</button>${S.hasPin ? '<button type="button" class="btn danger" data-a="pinoff">Hapus PIN</button>' : ''}<span class="small" id="pin-msg" style="align-self:center;color:var(--red)"></span></div></div>`}
    <div class="dlg-f"><button type="button" class="btn danger" data-a="logout">Keluar</button><span class="sp"></span><button type="button" class="btn primary" data-a="close">Tutup</button></div></div>`;
  if (!dlg().open) dlg().showModal();
}
function openDocMenu() {
  const d = cur(), it = curItem();
  dlg().innerHTML = `<div class="dlg"><h2>${esc(d.name || 'Data perhitungan')}</h2>
    <p class="muted small" style="margin:0">${(d.lines || []).length} item${it ? ' · diubah ' + fullDT(it.updated) : ' · belum disimpan'}</p>
    <div class="dlg-grid">
      <button type="button" class="btn" data-a="copydoc">📋 Salin sebagai teks</button>
      <button type="button" class="btn" data-a="csvdoc">⬇ Unduh CSV (Excel)</button>
      ${RO() ? '' : `${it ? `<button type="button" class="btn" data-a="dupdoc" data-v="${esc(key(it))}">⧉ Duplikat data</button><button type="button" class="btn danger" data-a="deldoc" data-v="${esc(key(it))}">🗑 Hapus data</button>` : ''}<button type="button" class="btn danger" data-a="clearlines">Kosongkan semua item</button>`}
    </div>
    <div class="dlg-f"><span class="sp"></span><button type="button" class="btn primary" data-a="close">Tutup</button></div></div>`;
  if (!dlg().open) dlg().showModal();
}
function openRename(k) {
  const it = S.items.get(k); if (!it) return;
  dlg().innerHTML = `<form class="dlg" id="rename-form" data-k="${esc(k)}"><h2>Ganti nama data</h2>
    <input id="rename-in" value="${esc(it.data.name)}" maxlength="120" required>
    <div class="dlg-f"><span class="sp"></span><button type="button" class="btn" data-a="close">Batal</button><button type="submit" class="btn primary">Simpan</button></div></form>`;
  if (!dlg().open) dlg().showModal(); setTimeout(() => $('#rename-in')?.select(), 30);
}
async function pinChange(old, nw, out) {
  out.textContent = 'Menyimpan…';
  try {
    const r = await rpc('pl_pin_set', { p_owner: S.user, p_old: old || S.pin || null, p_new: nw || null });
    if (!r?.ok) { out.textContent = r?.pin === 'wrong' || r?.pin === 'need' ? 'PIN saat ini salah.' : PIN_MSG[r?.pin] || 'Gagal.'; return; }
    S.pin = nw; S.hasPin = !!nw;
    if (nw) { SS.set('pin.' + S.user, nw); LS.set('u.' + S.user + '.haspin', '1'); LS.set('u.' + S.user + '.pinhash', await pinHash(S.user, nw)); }
    else { SS.del('pin.' + S.user); LS.del('u.' + S.user + '.haspin'); LS.del('u.' + S.user + '.pinhash'); }
    openMenu(); toast(nw ? 'PIN tersimpan ✓ — berlaku juga di Planner & Notes' : 'PIN dihapus.');
  } catch (e) { out.textContent = 'Tidak bisa menghubungi server (' + e.message + ').'; }
}
let toastT = null;
function toast(msg) {
  let t = $('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600);
}
function applyTheme() { const t = LS.get('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }
function sure(el, label, fn) { // two clicks instead of confirm()
  if (!el.dataset.sure) { const old = el.textContent; el.dataset.sure = '1'; el.textContent = label; setTimeout(() => { if (el.isConnected) { delete el.dataset.sure; el.textContent = old; } }, 4000); return; }
  fn();
}

// ---------- actions ----------
const findLine = id => (cur().lines || []).find(l => l.id === id);
const A = {
  view: el => setView(el.dataset.v),
  menu: () => openMenu(),
  close: () => dlg().close(),
  logout: () => logout(),
  gateback: () => { S.gate = null; render(); },
  key: el => keyAct(el.dataset.v),
  ck: el => pressKey(el.dataset.v),
  dp: el => dpadAct(el.dataset.v),
  lcdpick: el => menuPick(+el.dataset.v),
  hload: el => { const h = S.items.get(S.user ? S.user + '/' + el.dataset.v : [...S.items.keys()].find(k => k.endsWith('/' + el.dataset.v))); if (!h) return; S.justEval = false; S.lastEq = null; S.prompt = null; S.histOpen = false; setExpr(h.data.e); render(); },
  hdel: el => { const h = S.items.get(S.user + '/' + el.dataset.v); if (h) put({ ...h, data: {}, deleted: true }); },
  hdata: el => {
    const h = S.items.get(S.user + '/' + el.dataset.v); if (!h) return; let v = h.data.v; if (!Number.isFinite(v)) try { v = evaluate(h.data.r); } catch { v = NaN; }
    mutate(d => d.lines.push({ id: rid('l'), sh: 'expr', lb: '', e: h.data.e, r: v, tot: v, n: '1', unit: '', t: Date.now() }), true);
    toast(`Ditambahkan ke "${cur().name || 'data baru'}" — ubah satuannya di 📐 Luas & Volume`); render();
  },
  histclear: el => sure(el, 'Yakin? Klik lagi', () => { for (const h of hist()) put({ ...h, data: {}, deleted: true }, true); render(); toast('Riwayat dihapus.'); }),
  cat: el => { S.cat = el.dataset.v; LS.set('cat', S.cat); if (SMAP.get(S.shape).cat !== S.cat) { S.shape = SHAPES.find(s => s.cat === S.cat).id; LS.set('shape', S.shape); } S.edit = null; render(); },
  shape: el => { S.shape = el.dataset.v; LS.set('shape', S.shape); S.edit = null; if (matchMedia('(max-width:820px)').matches) LS.del('chips'); render(); setTimeout(() => { if (!matchMedia('(pointer:coarse)').matches) $('#in-' + SMAP.get(S.shape).f[0].k)?.focus(); }, 20); },
  chips: () => { chipsOpen() ? LS.del('chips') : LS.set('chips', '1'); render(); },
  fopt: el => { form().o[el.dataset.k] = el.dataset.v; render(); },
  fclear: () => { const fm = form(); fm.v = {}; fm.n = '1'; fm.lb = ''; render(); },
  editline: el => {
    const ln = findLine(el.dataset.v); if (!ln) return;
    if (ln.sh === 'expr') { S.justEval = false; S.expr = ln.e; setView('calc'); toast('Ekspresi dibuka di kalkulator'); return; }
    const sh = SMAP.get(ln.sh); S.cat = sh.cat; S.shape = sh.id; S.edit = ln.id;
    const fm = form(sh.id); fm.v = { ...ln.v }; fm.u = Object.fromEntries(sh.f.filter(f => f.t === 'len' || f.t === 'area').map(f => [f.k, ln.u?.[f.k] || (f.t === 'len' ? 'm' : 'm²')])); fm.o = { ...fm.o, ...ln.o }; fm.n = ln.n || '1'; fm.lb = ln.lb || '';
    render(); $('#geo-form')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  },
  editcancel: () => { S.edit = null; const fm = form(); fm.v = {}; fm.lb = ''; fm.n = '1'; render(); },
  dupline: el => { mutate(d => { const i = d.lines.findIndex(l => l.id === el.dataset.v); if (i >= 0) d.lines.splice(i + 1, 0, { ...clone(d.lines[i]), id: rid('l'), t: Date.now() }); }); },
  delline: el => { if (S.edit === el.dataset.v) S.edit = null; mutate(d => { d.lines = d.lines.filter(l => l.id !== el.dataset.v); }); },
  savedoc: () => saveDraft(),
  newdoc: el => {
    if (!S.curId && S.draft.lines.length) return sure(el, '⚠ Buang draft? Klik lagi', newData);
    newData();
  },
  opendraft: () => { S.curId = null; LS.del(cacheKey() + '.cur'); setView('geo'); },
  opendoc: el => openDoc(el.dataset.v),
  docmenu: () => openDocMenu(),
  copydoc: () => copyText(docText(cur())),
  csvdoc: () => { const d = cur(); download((d.name || 'data-perhitungan').replace(/[^\w\- .]+/g, '_') + '.csv', docCsv(d), 'text/csv;charset=utf-8'); },
  clearlines: el => sure(el, '⚠ Yakin? Klik lagi', () => { mutate(d => { d.lines = []; }); dlg().close(); }),
  rename: el => openRename(el.dataset.v),
  dupdoc: el => {
    const it = S.items.get(el.dataset.v); if (!it) return;
    const id = rid('d_'); put({ id, owner: S.user, kind: 'data', deleted: false, data: { ...clone(it.data), name: (it.data.name || 'Data') + ' (salinan)', created: Date.now() } }, true);
    if (dlg().open) dlg().close(); render(); toast('Duplikat dibuat ✓');
  },
  deldoc: el => sure(el, '⚠ Hapus? Klik lagi', () => {
    const it = S.items.get(el.dataset.v); if (!it) return;
    put({ ...it, deleted: true }, true); if (S.curId === it.id) { S.curId = null; LS.del(cacheKey() + '.cur'); }
    if (dlg().open) dlg().close(); render(); toast('Data dihapus.');
  }),
  pinsave: () => {
    const old = $('#pin-old')?.value || '', a = $('#pin-new').value, b = $('#pin-new2').value, out = $('#pin-msg');
    if (!/^\d{4,12}$/.test(a)) { out.textContent = PIN_MSG.format; return; }
    if (a !== b) { out.textContent = 'PIN baru tidak sama.'; return; }
    if (S.hasPin && !old) { out.textContent = 'Masukkan PIN saat ini.'; return; }
    pinChange(old, a, out);
  },
  pinoff: () => { const old = $('#pin-old')?.value || '', out = $('#pin-msg'); if (!old) { out.textContent = 'Masukkan PIN saat ini untuk menghapus.'; return; } pinChange(old, '', out); }
};
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-a]'); if (!el || !A[el.dataset.a] || el.disabled) return;
  if (ev.target.closest('select') && !el.matches('select')) return; // unit select inside a clickable row
  ev.preventDefault(); ev.stopPropagation(); A[el.dataset.a](el);
});
// keypad buttons must not steal focus/caret from the display
document.addEventListener('pointerdown', ev => { if (ev.target.closest('.ck,.dp,.lm-i')) ev.preventDefault(); });
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'user-in') syncMask();
  if (t.dataset.u) unitChange(t);
  if (t.id === 'disp') { S.expr = t.value; S.justEval = false; S.err = ''; S.caret = [t.selectionStart, t.selectionEnd]; updPreview(); }
  if (t.id === 'calc-q') { S.calcQ = t.value; render(); }
  if (t.id === 'data-q') { S.q = t.value; render(); }
  if (t.dataset.f) {
    const fm = form(); if (t.dataset.f === 'n') fm.n = t.value; else if (t.dataset.f === 'lb') { fm.lb = t.value; return; } else fm.v[t.dataset.f] = t.value;
    const sh = SMAP.get(S.shape), r = compute(sh, fm), box = $('#geo-res'); if (box) box.innerHTML = resBox(sh, r);
    const lab = t.closest('.fi'), err = r.errs?.[t.dataset.f]; lab?.classList.toggle('bad', !!err);
    let sm = lab?.querySelector('.ferr'); if (err) { if (!sm) { sm = document.createElement('small'); sm.className = 'ferr'; lab.appendChild(sm); } sm.textContent = err; } else sm?.remove();
  }
  if (t.id === 'doc-name') { const v = t.value; mutate(d => { d.name = v; }, true); }
});
function unitChange(t) { const fm = form(); fm.u[t.dataset.u] = t.value; LS.set('units2.' + S.shape, JSON.stringify(fm.u)); const sh = SMAP.get(S.shape); const box = $('#geo-res'); if (box) box.innerHTML = resBox(sh, compute(sh, fm)); }
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.u) unitChange(t);
  if (t.name === 'theme') { t.value === 'auto' ? LS.del('theme') : LS.set('theme', t.value); applyTheme(); }
  if (t.name === 'dec') { t.value === 'id' ? LS.del('dec') : LS.set('dec', t.value); render(); }
  if (t.id === 'shape-sel') { S.shape = t.value; LS.set('shape', S.shape); S.edit = null; render(); }
  if (t.dataset.lu) { const id = t.dataset.lu, v = t.value; mutate(d => { const ln = d.lines.find(l => l.id === id); if (ln) ln.unit = v; }); }
});
document.addEventListener('keyup', ev => { if (ev.target.id === 'disp') S.caret = [ev.target.selectionStart, ev.target.selectionEnd]; });
document.addEventListener('selectionchange', () => { const d = disp(); if (d && document.activeElement === d && (S.caret?.[0] !== d.selectionStart || S.caret?.[1] !== d.selectionEnd)) { S.caret = [d.selectionStart, d.selectionEnd]; updPreview(); } });
document.addEventListener('keydown', ev => {
  if (dlg().open || ev.metaKey || ev.ctrlKey || ev.altKey || S.view !== 'calc' || (!S.user && !S.admin)) return;
  const t = ev.target, inDisp = t.id === 'disp', typing = /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) && !inDisp;
  if (typing) return;
  if (S.off) { if (inDisp) ev.preventDefault(); return; }
  if (S.menu) {
    ev.preventDefault();
    if (/^\d$/.test(ev.key)) menuDigit(+ev.key);
    else if (ev.key === 'Enter' || ev.key === '=') { const f = S.menu.onEq; if (f) { closeMenu(); f(); updPreview(); } }
    else if (ev.key === 'Escape') closeMenu();
    else if (ev.key === 'ArrowUp') menuPage(-1);
    else if (ev.key === 'ArrowDown') menuPage(1);
    return;
  }
  if (ev.key === 'Enter' || (ev.key === '=' )) { ev.preventDefault(); equals(); return; }
  if (ev.key === 'Escape') { ev.preventDefault(); if (S.histOpen) keyAct('@hist'); else keyAct('@ac'); return; }
  if (ev.key === 'ArrowUp' || ev.key === 'ArrowDown') { ev.preventDefault(); histNav(ev.key === 'ArrowUp' ? 1 : -1); return; }
  if (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight') { ev.preventDefault(); moveCaret(ev.key === 'ArrowLeft' ? -1 : 1); return; }
  if (inDisp && ev.key === 'Backspace' && S.justEval) { ev.preventDefault(); back(); return; }
  if (inDisp) { if (S.justEval && ev.key.length === 1) { // typing after "=": digits start fresh, operators continue
      if (/[\d.(]/.test(ev.key)) { ev.preventDefault(); ins(ev.key); } else S.justEval = false; } return; }
  if (ev.key === 'Backspace') { ev.preventDefault(); back(); return; }
  const map = { '*': '×', '/': '÷', '-': '−', 'x': '×' };
  if (/^[\d.+\-*/^()!%,]$|^x$|^[A-FXYM]$/.test(ev.key)) { ev.preventDefault(); ins(map[ev.key] || VAR_CH[ev.key] || ev.key); }
});
document.addEventListener('submit', ev => {
  const f = ev.target; ev.preventDefault();
  if (f.id === 'geo-form') { addLine(); return; }
  if (f.id === 'rename-form') { const it = S.items.get(f.dataset.k), v = $('#rename-in').value.trim(); if (it && v) put({ ...it, data: { ...it.data, name: v } }); dlg().close(); return; }
  if (f.id === 'gate-form') {
    const btn = f.querySelector('button'); btn.disabled = true; btn.textContent = 'Membuka…';
    const pinMode = !!S.gate, name = pinMode ? S.gate.name : $('#user-in').value, pin = pinMode ? $('#pin-in').value : '';
    if (pinMode && !pin) { btn.disabled = false; btn.textContent = 'Masuk'; $('#gate-err').textContent = PIN_MSG.need; return; }
    login(name, pinMode ? '' : $('#pass-in').value, $('#remember').checked, pin).then(render, e => {
      if (e.needPin && !pinMode) { S.gate = { name: normUser(name), msg: '' }; render(); return; }
      btn.disabled = false; btn.textContent = 'Masuk'; $('#gate-err').textContent = e.message; const pi = $('#pin-in'); if (pi) { pi.value = ''; pi.focus(); } });
  }
});
dlg().addEventListener('click', ev => { if (ev.target === dlg()) dlg().close(); }); // click on backdrop

// ---------- auto update + boot ----------
async function checkUpdate() { // phones keep old copies; load the newer build
  if (dlg().open || S.queue.size) return;
  try {
    const r = await fetch(location.pathname + '?_=' + Date.now(), { cache: 'no-store' }); const m = /const BUILD = '([^']+)'/.exec(await r.text());
    if (m && m[1] !== BUILD && m[1] !== '__BUILD__' && SS.get('reloaded') !== m[1]) { SS.set('reloaded', m[1]); location.replace(location.pathname + '?v=' + m[1] + location.hash); }
  } catch {}
}
setInterval(() => { if (!document.hidden) syncNow(); }, 10000);
setInterval(checkUpdate, 10 * 60e3);
document.addEventListener('visibilitychange', () => { if (!document.hidden) syncNow(); });
window.addEventListener('online', () => syncNow());
window.addEventListener('focus', () => syncNow());

function boot() {
  applyTheme(); checkUpdate();
  let s = null; try { s = JSON.parse(LS.get('session') || 'null'); } catch {}
  const ssUser = SS.get('user'), ssAdmin = SS.get('admin');
  if (s?.admin || ssAdmin) {
    if (ssAdmin) { S.admin = true; S.pass = ssAdmin; loadCache(); render(); liveStart(); syncNow(); return; }
    LS.del('session'); // admin password is never stored on the device; ask again
  } else if (s?.user || ssUser) {
    const name = s?.user || ssUser, pin = SS.get('pin.' + name) || '';
    if (LS.get('u.' + name + '.haspin') && !pin) { S.gate = { name, msg: '' }; render(); return; } // PIN asked on every new visit
    S.user = name; S.pin = pin; S.hasPin = !!LS.get('u.' + name + '.haspin'); loadCache();
    render(); liveStart(); syncNow(); return;
  }
  render();
}
boot();
</script>
</body>
